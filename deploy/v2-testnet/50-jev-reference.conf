[Service]
# Hide unrelated home directories, exposing only the optional shared JEV SDK
# and its existing private configuration. Never copy credentials into a release.
# Missing JEV files must degrade the reference, not stop the trading controller.
ProtectHome=tmpfs
BindReadOnlyPaths=-/home/ubuntu/shared/jev
BindReadOnlyPaths=-/home/ubuntu/.config/jev
