# HTTPS read-only operator dashboard on the dedicated public port.
server {
    listen 9527 ssl;
    server_name 43-133-4-231.sslip.io;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/43-133-4-231.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43-133-4-231.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /var/log/nginx/trade_v2_dashboard_error.log warn;
    client_max_body_size 1k;

    location / {
        auth_basic "ATLAS V2";
        auth_basic_user_file /etc/nginx/trade-v2-dashboard.htpasswd;
        proxy_pass http://127.0.0.1:19527;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Connection close;
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
    }
}
