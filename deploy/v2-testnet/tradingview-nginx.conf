# TradingView V2 public edge. Certbot adds the managed TLS server directives.
server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:18080;
    server_name 43-133-4-231.sslip.io;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 3s;
    send_timeout 3s;

    access_log /var/log/nginx/tradingview_v2_access.log;
    error_log /var/log/nginx/tradingview_v2_error.log warn;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"service":"trade-v2-edge"}';
    }

    # Independent V2 signal intake; no exchange credentials or order endpoint.
    location = /v2/webhooks/tradingview {
        limit_except POST {
            deny all;
        }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection close;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:18081;
    }

    location / {
        return 404;
    }
}
