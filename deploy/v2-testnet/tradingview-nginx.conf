# TradingView V2 public edge. Certbot adds the managed TLS server directives.
server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:18080;
    server_name 43-133-4-231.sslip.io;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 3s;
    send_timeout 3s;

    access_log /var/log/nginx/tradingview_v2_access.log;
    error_log /var/log/nginx/tradingview_v2_error.log warn;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"service":"trade-v2-edge"}';
    }

    # Fail closed until the isolated V2 WSGI ingress is deployed locally.
    location = /v2/webhooks/tradingview {
        limit_except POST {
            deny all;
        }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '{"error":"INGRESS_NOT_DEPLOYED"}';
    }

    location / {
        return 404;
    }
}
