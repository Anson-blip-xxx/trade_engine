# Include inside the existing authenticated HTTPS dashboard server.
location ~ ^/(accounts(?:/.*)?|api/accounts(?:/.*)?)$ {
    auth_basic "ATLAS V2";
    auth_basic_user_file /etc/nginx/trade-v2-dashboard.htpasswd;
    client_max_body_size 8k;
    client_body_buffer_size 16k;
    client_body_in_file_only off;
    client_body_timeout 10s;
    access_log off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_pass http://127.0.0.1:19528;
    proxy_set_header Host $host;
    proxy_set_header X-V2-Authenticated-User $remote_user;
    proxy_set_header Authorization "";
    proxy_set_header Connection close;
    proxy_connect_timeout 1s;
    proxy_send_timeout 10s;
    proxy_read_timeout 35s;
    proxy_next_upstream off;
}
